# Managed by OOM Guard (io.github.zeus-deus.oomguard).
# Installed by helper/install.sh, removed by helper/uninstall.sh. install.sh
# only installs it when earlyoom's own ExecStart is exactly
# "/usr/bin/earlyoom $EARLYOOM_ARGS" (the Arch package), so this keeps every
# option from /etc/default/earlyoom and only appends "--ignore <names>".
[Service]
EnvironmentFile=-/etc/oomguard/earlyoom.env
ExecStart=
ExecStart=/usr/bin/earlyoom $EARLYOOM_ARGS $OOMGUARD_ARGS
