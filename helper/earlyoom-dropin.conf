# Installed by OOM Guard (helper/install.sh). Removed by helper/uninstall.sh.
# Keeps earlyoom's own arguments from /etc/default/earlyoom and appends
# "--ignore <names>" built from the OOM Guard panel's protected list.
[Service]
EnvironmentFile=-/etc/oomguard/earlyoom.env
ExecStart=
ExecStart=/usr/bin/earlyoom $EARLYOOM_ARGS $OOMGUARD_ARGS
